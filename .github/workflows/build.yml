# Builds PhotoSweep on a GitHub-hosted Mac and uploads an unsigned .ipa.
#
# There is no Mac in this project's development loop, so this workflow IS the compiler.
# Download the artifact and install it with Sideloadly (Windows), which signs it with
# your own Apple ID at install time — which is why the build here is deliberately unsigned.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The project uses file-system-synchronised groups (objectVersion 77), which need
      # Xcode 16 or later. Runner images ship several Xcodes; pick the newest rather than
      # trusting whichever one happens to be selected by default.
      - name: Select the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          echo "--- available SDKs ---"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build for device
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoSweep.xcodeproj \
            -scheme PhotoSweep \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log

      # The whole point of this workflow is the error list, so make it easy to read
      # instead of making someone scroll 4,000 lines of build output.
      - name: Summarise compile errors
        if: failure()
        run: |
          echo "### Compile errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "(error|warning): " build.log | sed 's|.*/PhotoSweep/|PhotoSweep/|' | sort -u | head -100 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package .ipa
        if: success()
        run: |
          APP="build/Build/Products/Release-iphoneos/PhotoSweep.app"
          test -d "$APP" || { echo "No .app produced at $APP"; ls -R build/Build/Products || true; exit 1; }
          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          (cd payload && zip -qry ../PhotoSweep.ipa Payload)
          ls -lh PhotoSweep.ipa

      - name: Upload .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-ipa
          path: PhotoSweep.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
