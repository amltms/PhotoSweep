# Fallback project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# You do NOT need this if PhotoSweep.xcodeproj opens fine in Xcode 16 or later.
# If it does not, delete PhotoSweep.xcodeproj, then run:  xcodegen generate
name: PhotoSweep
options:
  bundleIdPrefix: com.amltms
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PhotoSweep:
    type: application
    platform: iOS
    sources:
      - path: PhotoSweep
    info:
      path: Info.plist
      properties:
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amltms.photosweep
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: PhotoSweep
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PhotoSweep shows you your own photos one at a time so you can swipe to tidy up your library. Nothing ever leaves your device, and nothing is deleted until you confirm it."
